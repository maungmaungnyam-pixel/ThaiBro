name = "thai-bro"
main = "worker.mjs"
compatibility_date = "2026-06-24"

[vars]
AUTH_PUBLIC_ORIGIN = "https://thai-bro.fork-thursday-3b9.workers.dev"
AUTH_FIREBASE_PROJECT_ID = "thai-bro"
AUTH_FIREBASE_EMAIL_ENABLED = "true"
AUTH_FIREBASE_GOOGLE_ENABLED = "true"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "thai-bro-content"
database_id = "88d8ed21-1a8f-4d93-b7d0-072e77d5cbed"

[triggers]
crons = ["*/15 * * * *", "0 */6 * * *"]
